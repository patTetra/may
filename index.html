<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Comptes</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px 100px 16px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .btn-icon {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
    }

    /* Dashboard */
    .dashboard-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    .solde-label { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .solde-main { font-size: 2.2rem; font-weight: 800; margin: 6px 0 16px 0; }
    .solde-prev-container {
      border-top: 1px solid #334155;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    /* Historique */
    .month-group { margin-bottom: 24px; }
    .month-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .ops-list {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .operation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .operation-item:active { background: #f1f5f9; }
    .operation-item:last-child { border-bottom: none; }
    .op-info { display: flex; flex-direction: column; gap: 4px; }
    .op-desc { font-weight: 600; font-size: 0.95rem; }
    
    .btn-validate-prev {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fcd34d;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 2px;
      width: fit-content;
    }

    .op-amount-block { text-align: right; }
    .op-amount { font-weight: 700; font-size: 1rem; }
    .op-amount.debit { color: var(--red); }
    .op-amount.credit { color: var(--green); }
    .op-date { font-size: 0.8rem; color: var(--text-muted); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 220px);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 1.8rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 480px) { .fab { right: 24px; } }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { margin: 0; font-size: 1.2rem; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background: var(--bg);
    }
    .type-selector { display: flex; gap: 8px; }
    .type-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .type-btn.active.debit { background: #fee2e2; color: var(--red); border-color: var(--red); }
    .type-btn.active.credit { background: #dcfce7; color: var(--green); border-color: var(--green); }
    
    .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
    .btn-submit {
      flex: 2;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-delete {
      flex: 1;
      padding: 14px;
      background: #fee2e2;
      color: var(--red);
      border: 1px solid #fca5a5;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }
    .btn-reset {
      width: 100%;
      padding: 12px;
      background: #fef2f2;
      color: var(--red);
      border: 1px solid #fca5a5;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 10px;
    }

    #configModal .modal-content { border-radius: var(--radius); margin: auto 16px; }
    .divider { border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Mon Compte</h1>
    <button class="btn-icon" onclick="ouvrirConfig()">⚙️</button>
  </div>

  <div class="dashboard-card">
    <div class="solde-label">Solde Actuel</div>
    <div id="soldeActuel" class="solde-main">0,00 €</div>
    <div class="solde-prev-container">
      <span>Solde Prévisionnel</span>
      <strong id="soldePrevisionnel">0,00 €</strong>
    </div>
  </div>

  <div id="historiqueContainer">Chargement...</div>

  <button class="fab" onclick="ouvrirModalAjout()">+</button>

  <!-- MODAL ÉDITION / AJOUT -->
  <div id="opModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Nouvelle opération</h2>
        <button class="btn-icon" onclick="fermerModalOp()">✕</button>
      </div>
      <form onsubmit="sauvegarderOperation(event)">
        <input type="hidden" id="editOpId">

        <div class="form-group type-selector">
          <button type="button" id="btnTypeDebit" class="type-btn active debit" onclick="setType('debit')">Débit</button>
          <button type="button" id="btnTypeCredit" class="type-btn credit" onclick="setType('credit')">Crédit</button>
        </div>

        <div class="form-group">
          <label>Montant (€)</label>
          <input type="number" step="0.01" inputmode="decimal" id="montantOp" class="form-control" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="descOp" class="form-control" placeholder="ex: Courses..." required>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="dateOp" class="form-control" required>
        </div>

        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="isPrevision"> Opération prévisionnelle
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnDelete" class="btn-delete" onclick="supprimerOperation()">Supprimer</button>
          <button type="submit" id="btnSubmit" class="btn-submit">Valider</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIGURATION -->
  <div id="configModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Configuration & Options</h2>
        <button class="btn-icon" onclick="fermerConfig()">✕</button>
      </div>

      <div class="form-group"><label>Pseudo GitHub</label><input type="text" id="ghUser" class="form-control"></div>
      <div class="form-group"><label>Nom du Dépôt</label><input type="text" id="ghRepo" class="form-control"></div>
      <div class="form-group"><label>Personal Access Token</label><input type="password" id="ghToken" class="form-control"></div>
      
      <button class="btn-submit" style="width:100%" onclick="sauvegarderConfig()">Enregistrer les accès</button>

      <div class="divider"></div>

      <h3>⚡ Réinitialisation du compte</h3>
      <div class="form-group">
        <label>Solde de départ (€)</label>
        <input type="number" step="0.01" inputmode="decimal" id="soldeDepart" class="form-control" placeholder="ex: 1500.00">
      </div>
      <button class="btn-reset" onclick="reinitialiserTout()">Tout effacer & Réinitialiser le compte</button>
    </div>
  </div>

  <script>
    let rawData = { operations: [] };
    let fileSha = "";
    let currentType = "debit";

    function setType(type) {
      currentType = type;
      document.getElementById('btnTypeDebit').className = `type-btn debit ${type === 'debit' ? 'active' : ''}`;
      document.getElementById('btnTypeCredit').className = `type-btn credit ${type === 'credit' ? 'active' : ''}`;
    }

    function ouvrirModalAjout() {
      document.getElementById('modalTitle').innerText = "Nouvelle opération";
      document.getElementById('editOpId').value = "";
      document.getElementById('descOp').value = "";
      document.getElementById('montantOp').value = "";
      document.getElementById('dateOp').valueAsDate = new Date();
      document.getElementById('isPrevision').checked = false;
      document.getElementById('btnDelete').style.display = 'none';
      setType('debit');
      
      document.getElementById('opModal').classList.add('open');
      setTimeout(() => document.getElementById('montantOp').focus(), 100);
    }

    function ouvrirModalEdition(id) {
      const op = rawData.operations.find(o => o.id === id);
      if (!op) return;

      document.getElementById('modalTitle').innerText = "Modifier l'opération";
      document.getElementById('editOpId').value = op.id;
      document.getElementById('descOp').value = op.description;
      document.getElementById('montantOp').value = op.montant;
      document.getElementById('dateOp').value = op.date;
      document.getElementById('isPrevision').checked = !!op.isPrevision;
      document.getElementById('btnDelete').style.display = 'block';
      setType(op.type);

      document.getElementById('opModal').classList.add('open');
    }

    function fermerModalOp() { document.getElementById('opModal').classList.remove('open'); }
    function ouvrirConfig() {
      const { user, repo, token } = getConfig();
      document.getElementById('ghUser').value = user || '';
      document.getElementById('ghRepo').value = repo || '';
      document.getElementById('ghToken').value = token || '';
      document.getElementById('configModal').classList.add('open');
    }
    function fermerConfig() { document.getElementById('configModal').classList.remove('open'); }

    function getConfig() {
      return {
        user: localStorage.getItem('gh_user'),
        repo: localStorage.getItem('gh_repo'),
        token: localStorage.getItem('gh_token')
      };
    }

    function sauvegarderConfig() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      fermerConfig();
      chargerDonnees();
    }

    async function chargerDonnees() {
      const { user, repo, token } = getConfig();
      if (!user || !repo || !token) { ouvrirConfig(); return; }

      const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
      try {
        const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
        const file = await res.json();
        fileSha = file.sha;
        
        const content = decodeURIComponent(escape(atob(file.content)));
        rawData = JSON.parse(content);
        afficherDonnees();
      } catch (e) {
        alert("Erreur de connexion GitHub.");
      }
    }

    function afficherDonnees() {
      const ops = rawData.operations || [];
      ops.sort((a, b) => new Date(b.date) - new Date(a.date));

      let soldeActuel = 0;
      let soldePrev = 0;
      const groupesParMois = {};

      ops.forEach(op => {
        const val = op.type === 'debit' ? -Math.abs(op.montant) : Math.abs(op.montant);
        soldePrev += val;
        if (!op.isPrevision) soldeActuel += val;

        const d = new Date(op.date);
        const moisAnnee = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        
        if (!groupesParMois[moisAnnee]) groupesParMois[moisAnnee] = [];
        groupesParMois[moisAnnee].push(op);
      });

      document.getElementById('soldeActuel').innerText = `${soldeActuel.toFixed(2)} €`;
      document.getElementById('soldePrevisionnel').innerText = `${soldePrev.toFixed(2)} €`;

      let html = "";
      for (const [mois, listeOps] of Object.entries(groupesParMois)) {
        html += `<div class="month-group">
          <div class="month-title">${mois}</div>
          <div class="ops-list">`;

        listeOps.forEach(op => {
          const d = new Date(op.date);
          const dateCourte = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
          const classeType = op.type === 'debit' ? 'debit' : 'credit';
          const signe = op.type === 'debit' ? '-' : '+';

          html += `
            <div class="operation-item" onclick="ouvrirModalEdition('${op.id}')" style="${op.isPrevision ? 'opacity: 0.65;' : ''}">
              <div class="op-info">
                <span class="op-desc">${op.description}</span>
                ${op.isPrevision ? 
                  `<button type="button" class="btn-validate-prev" onclick="event.stopPropagation(); validerPrevision('${op.id}')">
                    ⏳ Prévision (Cliquer pour passer en réel)
                   </button>` 
                  : ''}
              </div>
              <div class="op-amount-block">
                <div class="op-amount ${classeType}">${signe} ${Math.abs(op.montant).toFixed(2)} €</div>
                <div class="op-date">${dateCourte}</div>
              </div>
            </div>`;
        });

        html += `</div></div>`;
      }

      document.getElementById('historiqueContainer').innerHTML = html || "<p style='text-align:center; color:#94a3b8;'>Aucune opération enregistrée.</p>";
    }

    async function pushToGitHub(commitMessage) {
      const { user, repo, token } = getConfig();
      const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
      const nouveauContenuJSON = JSON.stringify(rawData, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(nouveauContenuJSON)));

      const res = await fetch(url, {
        method: 'PUT',
        headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: commitMessage,
          content: contentBase64,
          sha: fileSha
        })
      });

      if (res.ok) {
        fermerModalOp();
        fermerConfig();
        await chargerDonnees();
      } else {
        alert("Erreur lors de la mise à jour GitHub.");
      }
    }

    async function sauvegarderOperation(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Enregistrement...";
      btn.disabled = true;

      const editId = document.getElementById('editOpId').value;
      const opData = {
        id: editId || Date.now().toString(),
        date: document.getElementById('dateOp').value,
        description: document.getElementById('descOp').value,
        montant: parseFloat(document.getElementById('montantOp').value),
        type: currentType,
        isPrevision: document.getElementById('isPrevision').checked
      };

      if (editId) {
        const idx = rawData.operations.findIndex(o => o.id === editId);
        if (idx !== -1) rawData.operations[idx] = opData;
      } else {
        rawData.operations.push(opData);
      }

      try {
        await pushToGitHub(`${editId ? 'Modif' : 'Ajout'} : ${opData.description}`);
      } catch (err) {
        alert("Erreur réseau.");
      } finally {
        btn.innerText = "Valider";
        btn.disabled = false;
      }
    }

    async function validerPrevision(id) {
      const op = rawData.operations.find(o => o.id === id);
      if (op) {
        op.isPrevision = false;
        await pushToGitHub(`Passage en réel : ${op.description}`);
      }
    }

    async function supprimerOperation() {
      const editId = document.getElementById('editOpId').value;
      if (!editId || !confirm("Supprimer définitivement cette opération ?")) return;

      rawData.operations = rawData.operations.filter(o => o.id !== editId);
      await pushToGitHub(`Suppression d'une opération`);
    }

    async function reinitialiserTout() {
      const montantDepartVal = parseFloat(document.getElementById('soldeDepart').value) || 0;
      
      const confirmation = confirm(`⚠️ ATTENTION : Cela va effacer toutes les opérations actuelles.\n\nSouhaites-tu réinitialiser le compte avec un solde de départ de ${montantDepartVal.toFixed(2)} € ?`);
      if (!confirmation) return;

      // On reconstruit un tableau vierge avec l'opération de départ
      const aujourdhui = new Date().toISOString().split('T')[0];
      rawData.operations = [
        {
          id: Date.now().toString(),
          date: aujourdhui,
          description: "Solde initial",
          montant: Math.abs(montantDepartVal),
          type: montantDepartVal >= 0 ? "credit" : "debit",
          isPrevision: false
        }
      ];

      await pushToGitHub("Réinitialisation complète du compte");
    }

    chargerDonnees();
  </script>
</body>
</html>

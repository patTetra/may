<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Compte</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --green: #10b981;
      --red: #ef4444;
      --blue: #2563eb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      background: var(--card);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    h2, h3 { margin-top: 0; }
    .solde-container {
      display: flex;
      justify-content: space-between;
      text-align: center;
    }
    .solde-box { flex: 1; }
    .solde-valeur { font-size: 1.4rem; font-weight: bold; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background: var(--blue);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .operation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .operation:last-child { border-bottom: none; }
    .debit { color: var(--red); font-weight: bold; }
    .credit { color: var(--green); font-weight: bold; }
    .prevision { opacity: 0.5; font-style: italic; }
    .tag-prev { font-size: 0.7rem; background: #e5e7eb; padding: 2px 6px; border-radius: 4px; }
    .config-sec { font-size: 0.8rem; color: #666; }
  </style>
</head>
<body>

  <h2> Mon Compte</h2>

  <!-- CONFIGURATION (Cachée après la 1ère saisie) -->
  <div id="configCard" class="card">
    <h3>⚙️ Configuration GitHub</h3>
    <input type="text" id="ghUser" placeholder="Pseudo GitHub (ex: user)">
    <input type="text" id="ghRepo" placeholder="Nom du dépô (ex: banque-app)">
    <input type="password" id="ghToken" placeholder="Personal Access Token (ghp_...)">
    <button onclick="sauvegarderConfig()">Enregistrer</button>
  </div>

  <!-- Bilan des soldes -->
  <div class="card solde-container">
    <div class="solde-box">
      <div>Solde Actuel</div>
      <div id="soldeActuel" class="solde-valeur">0,00 €</div>
    </div>
    <div class="solde-box">
      <div>Prévisionnel</div>
      <div id="soldePrevisionnel" class="solde-valeur">0,00 €</div>
    </div>
  </div>

  <!-- Formulaire d'ajout -->
  <div class="card">
    <h3> Nouvelle opération</h3>
    <form id="opForm" onsubmit="ajouterOperation(event)">
      <input type="date" id="dateOp" required>
      <input type="text" id="descOp" placeholder="Description (ex: Courses)" required>
      <input type="number" step="0.01" id="montantOp" placeholder="Montant (€)" required>
      
      <select id="typeOp">
        <option value="debit">Débit (Dépense)</option>
        <option value="credit">Crédit (Rentrée)</option>
      </select>

      <label style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="isPrevision"> Est-ce une prévision ?
      </label>

      <button type="submit" id="btnSubmit">Ajouter</button>
    </form>
  </div>

  <!-- Liste des opérations -->
  <div class="card">
    <h3> Historique</h3>
    <div id="listeOps">Chargement...</div>
  </div>

  <script>
    let rawData = { operations: [] };
    let fileSha = "";

    // Mettre la date du jour par défaut
    document.getElementById('dateOp').valueAsDate = new Date();

    function getConfig() {
      return {
        user: localStorage.getItem('gh_user'),
        repo: localStorage.getItem('gh_repo'),
        token: localStorage.getItem('gh_token')
      };
    }

    function sauvegarderConfig() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      document.getElementById('configCard').style.display = 'none';
      chargerDonnees();
    }

    async function chargerDonnees() {
      const { user, repo, token } = getConfig();
      if (!user || !repo || !token) {
        document.getElementById('configCard').style.display = 'block';
        return;
      }
      document.getElementById('configCard').style.display = 'none';

      const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
      
      try {
        const res = await fetch(url, { headers: { Authorization: `token ${token}` } });
        const file = await res.json();
        fileSha = file.sha;
        
        // Décodage de la donnée JSON reçue
        const content = decodeURIComponent(escape(atob(file.content)));
        rawData = JSON.parse(content);
        
        afficherDonnees();
      } catch (e) {
        alert("Erreur de chargement. Vérifie ton Token / Dépôt.");
      }
    }

    function afficherDonnees() {
      const ops = rawData.operations || [];
      
      // Trier par date du plus récent au plus ancien
      ops.sort((a, b) => new Date(b.date) - new Date(a.date));

      let soldeActuel = 0;
      let soldePrev = 0;
      let html = "";

      ops.forEach(op => {
        const val = op.type === 'debit' ? -Math.abs(op.montant) : Math.abs(op.montant);
        
        soldePrev += val;
        if (!op.isPrevision) soldeActuel += val;

        const classeType = op.type === 'debit' ? 'debit' : 'credit';
        const classePrev = op.isPrevision ? 'prevision' : '';
        const signe = op.type === 'debit' ? '-' : '+';

        html += `
          <div class="operation ${classePrev}">
            <div>
              <strong>${op.description}</strong> ${op.isPrevision ? '<span class="tag-prev">Prévision</span>' : ''}<br>
              <small style="color: #666;">${op.date}</small>
            </div>
            <div class="${classeType}">
              ${signe} ${Math.abs(op.montant).toFixed(2)} €
            </div>
          </div>
        `;
      });

      document.getElementById('soldeActuel').innerText = `${soldeActuel.toFixed(2)} €`;
      document.getElementById('soldePrevisionnel').innerText = `${soldePrev.toFixed(2)} €`;
      document.getElementById('listeOps').innerHTML = html || "<p>Aucune opération.</p>";
    }

    async function ajouterOperation(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Enregistrement...";
      btn.disabled = true;

      const nouvelleOp = {
        id: Date.now().toString(),
        date: document.getElementById('dateOp').value,
        description: document.getElementById('descOp').value,
        montant: parseFloat(document.getElementById('montantOp').value),
        type: document.getElementById('typeOp').value,
        isPrevision: document.getElementById('isPrevision').checked
      };

      rawData.operations.push(nouvelleOp);

      // Préparation de l'envoi sur GitHub
      const { user, repo, token } = getConfig();
      const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
      const nouveauContenuJSON = JSON.stringify(rawData, null, 2);
      const contentBase64 = btoa(unescape(encodeURIComponent(nouveauContenuJSON)));

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Ajout : ${nouvelleOp.description}`,
            content: contentBase64,
            sha: fileSha
          })
        });

        if (res.ok) {
          // Reset du formulaire
          document.getElementById('descOp').value = '';
          document.getElementById('montantOp').value = '';
          document.getElementById('isPrevision').checked = false;
          
          await chargerDonnees(); // Recharge la vue
        } else {
          alert("Erreur lors de la sauvegarde sur GitHub.");
        }
      } catch (err) {
        alert("Erreur réseau.");
      } finally {
        btn.innerText = "Ajouter";
        btn.disabled = false;
      }
    }

    // Lancement au chargement
    chargerDonnees();
  </script>
</body>
</html>
